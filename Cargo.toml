[package]
name = "ecgen-rs"
version = "0.1.5"
edition = "2021"
description = "Enumerative Combinatoric Generation in Rust"
repository = "https://github.com/luk036/ecgen-rs"
license = "MIT OR Apache-2.0"
rust-version = "1.70"

[lib]
name = "ecgen"
path = "src/lib.rs"

[dependencies]
genawaiter = { version = "0.99.1", features = ["futures03"] }
log = { version = "0.4.32", optional = true }
env_logger = { version = "0.11.10", optional = true }
svgbobdoc = { version = "0.3", optional = true, features = ["enable"] }

[features]
default = ["std"]
std = ["dep:log", "dep:env_logger"]
doc-images = ["dep:svgbobdoc"]

[package.metadata.docs.rs]
features = ["doc-images"]

[dev-dependencies]
criterion = "0.8.2"
proptest = "1"

[[bench]]
name = "main"
harness = false

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "old_new"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1